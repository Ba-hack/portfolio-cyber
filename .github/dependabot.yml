# Dependabot : met à jour automatiquement les dépendances vulnérables.
#
# Rôle par rapport aux workflows de scan (voir .github/workflows/) :
#   - "npm audit" et les scans SAST DÉTECTENT les problèmes à chaque push.
#   - Dependabot, lui, agit en continu même sans nouveau push : il surveille
#     les bases de vulnérabilités connues (GitHub Advisory Database) et
#     ouvre automatiquement une Pull Request qui met à jour la dépendance
#     concernée vers une version corrigée.
#
# Deux "écosystèmes" sont surveillés :
#   - npm             : les packages du projet (Next.js, React, etc.)
#   - github-actions  : les actions utilisées dans nos workflows CI
#                       (actions/checkout, github/codeql-action, ...) —
#                       important pour rester sur des versions à jour et
#                       non dépréciées.
# "cooldown" (repris sur les deux écosystèmes ci-dessous) : Dependabot
# n'ouvre une Pull Request qu'une fois la nouvelle version publiée depuis
# au moins N jours. Objectif : se protéger d'une attaque de la chaîne
# d'approvisionnement où un paquet compromis serait publié puis retiré
# quelques heures/jours plus tard — laisser passer un peu de temps donne
# une chance à la communauté de détecter le problème avant qu'on
# n'installe la version concernée. Les mises à jour de SÉCURITÉ (failles
# déjà connues) ne sont, elles, jamais retardées par ce mécanisme.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Vérification hebdomadaire : suffisant pour un projet personnel,
      # évite d'être submergé de Pull Requests.
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "security"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
